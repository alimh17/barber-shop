name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: barbershop
          POSTGRES_PASSWORD: barbershop123
          POSTGRES_DB: barbershop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U barbershop -d barbershop"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://barbershop:barbershop123@localhost:5432/barbershop?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and migrate disposable CI database
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
      - name: API and frontend build
        run: pnpm build:all
      - name: Unit and database integration tests
        run: pnpm test
      - name: Lint
        run: pnpm lint:all
      - name: Docker build
        run: |
          docker build --target production -t barbershop-api-api:ci .
          docker build --target web -t barbershop-api-nginx:ci .
