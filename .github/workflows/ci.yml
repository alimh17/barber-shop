name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: barbershop
          POSTGRES_PASSWORD: barbershop123
          POSTGRES_DB: barbershop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U barbershop -d barbershop"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://barbershop:barbershop123@localhost:5432/barbershop?schema=public
      NODE_ENV: test
      SMS_PROVIDER: mock
      REDIS_MODE: memory
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-deployment
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-deployment
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and migrate disposable CI database
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
      - name: API and frontend build
        run: pnpm build:all
      - name: Unit and database integration tests
        run: pnpm test
      - name: Lint
        run: pnpm lint:all
      - name: Docker build
        run: |
          docker build --target production -t barbershop-api-api:ci .
          docker build --target web -t barbershop-api-nginx:ci .
  backup-restore-isolated:
    name: Disposable PostgreSQL backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate disaster recovery scripts
        run: bash -n scripts/backup-staging-db.sh scripts/verify-backup-restore.sh
      - name: Verify archive, restore and corruption detection
        run: bash scripts/test-backup-restore-isolated.sh
  isolated-e2e:
    name: Isolated Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: 'true'
      E2E_ISOLATED: '1'
      E2E_DB_PASSWORD: ci-only-e2e-database-password
      E2E_REDIS_PASSWORD: ci-only-e2e-redis-password
      E2E_JWT_ACCESS_SECRET: ci-only-e2e-access-secret-never-use-in-production
      E2E_JWT_REFRESH_SECRET: ci-only-e2e-refresh-secret-never-use-in-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build isolated API, frontend and migration images
        run: |
          docker build --target production -t barbershop-api-api:latest .
          docker build --target web -t barbershop-api-nginx:latest .
          docker build --target build -t barbershop-api-migrate:latest .
      - name: Run all Playwright suites with fresh E2E database per suite
        run: bash scripts/run-ci-isolated-e2e.sh
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-playwright-evidence
          path: |
            e2e-ci-results/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
