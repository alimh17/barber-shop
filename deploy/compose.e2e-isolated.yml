name: barbershop-e2e
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?Set E2E_DB_PASSWORD}
      POSTGRES_DB: barbershop_e2e
    volumes:
      - e2e_postgres:/var/lib/postgresql/data
    networks: [e2e_backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d barbershop_e2e"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 320m
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${E2E_REDIS_PASSWORD:?Set E2E_REDIS_PASSWORD}
    networks: [e2e_backend]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 96m
  migrate:
    image: barbershop-api-migrate:latest
    profiles: [tools]
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://e2e:${E2E_DB_PASSWORD}@postgres:5432/barbershop_e2e?schema=public
    command: ["pnpm", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [e2e_backend]
  api:
    image: barbershop-api-api:latest
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://e2e:${E2E_DB_PASSWORD}@postgres:5432/barbershop_e2e?schema=public
      REDIS_URL: redis://:${E2E_REDIS_PASSWORD}@redis:6379/0
      JWT_ACCESS_SECRET: ${E2E_JWT_ACCESS_SECRET:?Set E2E_JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${E2E_JWT_REFRESH_SECRET:?Set E2E_JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SMS_PROVIDER: mock
      REDIS_MODE: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [e2e_backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    mem_limit: 384m
  web:
    image: barbershop-api-nginx:latest
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx/e2e.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [e2e_backend]
    mem_limit: 64m
networks:
  e2e_backend:
    driver: bridge
volumes:
  e2e_postgres:
