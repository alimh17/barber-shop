# Opt-in HTTPS overlay. Do not apply before certificate files exist.
services:
  nginx:
    volumes:
      - ./deploy/nginx/staging.conf:/etc/nginx/conf.d/staging.conf:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/cloudflare-origin-allow.conf:/etc/nginx/cloudflare-origin-allow.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
