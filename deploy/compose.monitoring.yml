services:
  grafana:
    image: grafana/grafana:11.6.5
    restart: unless-stopped
    ports: ['127.0.0.1:3001:3000']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana:/etc/grafana/provisioning:ro
    mem_limit: 320m
    networks: [backend]
    depends_on: [prometheus, loki]
  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./deploy/monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    mem_limit: 384m
    networks: [backend]
  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=1GB]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 320m
    networks: [backend]
    depends_on: [blackbox, node-exporter]
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command: --config.file=/etc/blackbox_exporter/config.yml
    mem_limit: 64m
    networks: [backend]
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command: [--path.procfs=/host/proc, --path.sysfs=/host/sys, --path.rootfs=/host/root]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    mem_limit: 80m
    networks: [backend]
  alloy:
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    user: '0'
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data
    volumes:
      - ./deploy/monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/var/lib/alloy
    mem_limit: 160m
    networks: [backend]
    depends_on: [loki]
volumes:
  grafana_data:
  loki_data:
  prometheus_data:
  alloy_data:
